<div class="component-div">
  <div class="title-div">
    Включити в завдання
  </div>
  <div>
    <span class="task-type-span">
      <input type="checkbox" [formControl]="taskTypeCheckFormControls[0]" (click)=[onTaskTypeCheckClicked(0)] />Найпопулярніші твори
    </span>
    <span>&nbsp;</span>
    <span class="task-type-span">
      <input type="checkbox" [formControl]="taskTypeCheckFormControls[1]" (click)=[onTaskTypeCheckClicked(1)] />Твори із звіту партнера
    </span>
    <span>&nbsp;</span>
    <span class="task-type-span">
      <input type="checkbox" [formControl]="taskTypeCheckFormControls[2]" (click)=[onTaskTypeCheckClicked(2)] />Твори правовласника
    </span>
  </div>

  <div *ngIf="isSeachSocWork()">
    Не реалізовано
  </div>

  <div *ngIf="isSearchPartnerWork()">
    <div style="padding: 10px 10px 10px 10px;">
      <app-select-partner-work-source (finished)="onCreateTaskFinished()">
      </app-select-partner-work-source>
    </div>
  </div>

  <div *ngIf="isSearchRightHolderWork()">
    Не реалізовано
  </div>

</div>
