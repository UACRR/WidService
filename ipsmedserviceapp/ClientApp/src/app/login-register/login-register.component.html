<kendo-dialog title="Авторизація" (close)="closeDialog()">
  <div class="login-register content-wrap">
    <div class="container-main">
      <div class="login-register-wrap">
        <div class="login-register-nav">
          <div class="item-nav">
            <label>
              <input type="radio" name="login-register" checked (click)="singInChange('login')">
              <h1>Вхід</h1>
              <div class="red-line"></div>
            </label>
          </div>
          <div class="item-nav">
            <label>
              <input type="radio" name="login-register" (click)="singInChange('register')">
              <h1>Реєстрація</h1>
              <div class="red-line"></div>
            </label>
          </div>
        </div>
        <!-- логін -->
        <div *ngIf="isLogin" class="login-form active">
          <form [formGroup]="formLoginGroup">
            <input formControlName="login" class="login" type="email" placeholder="E-mail">
            <input formControlName="password" class="login" type="password" placeholder="Пароль">
            <label class="remember-me-wrap" for="remember-me">
              <input id="remember-me" type="checkbox">
              <div class="check-box-remember"></div>
              <h5>Запам'ятати мене</h5>
            </label>
          </form>
          <div class="btn" (click)="logIn()">Вхід</div>
          <p class="smaller-text" >Забули пароль?</p>
        </div>
        <!-- реєстрація -->
        <div *ngIf="isRegister" class="register-form active">
          <div class="inputs-flex">
            <input type="text" placeholder="Ім'я">
            <input type="text" placeholder="Прізвище">
          </div>
          <div class="inputs-flex">
            <input type="email" placeholder="E-mail*">
            <input type="phone" placeholder="Телефон">
          </div>
          <input type="password" placeholder="Пароль">
          <input type="password" placeholder="Підтвердіть пароль">
          <p class="smaller-text">*Адрес вашої електронної почти є логіном для входу в систему</p>
          <div class="btn" (click)="toLastStep(true)">Реєстрація</div>
        </div>
      </div>
    </div>
  </div>
  <!-- <div class="modal-bg"></div> -->
  <!-- останній крок реєстрації -->
  <div *ngIf="isLastStep" class="modal-wrap active">
    <div class="modal">
      <div class="close-btn" (click)="toLastStep(false)"></div>
      <h1>Вибір профілю</h1>
      <div class="red-line"></div>
      <div class="select-items-wrap">
        <label class="select-item" for="spog-rad">
          <input type="radio" name="select-profile" id="spog-rad">
          <div class="select-img us"></div>
          <div class="select-text">
            <h3>Користувач</h3>
          </div>
        </label>

        <label class="select-item" for="prav-rad">
          <input type="radio" name="select-profile" id="prav-rad" checked>
          <div class="select-img ad"></div>
          <div class="select-text">
            <h3>Правовласник</h3>
          </div>
        </label>

        <label class="select-item" for="pred-rad">
          <input type="radio" name="select-profile" id="pred-rad">
          <div class="select-img de"></div>
          <div class="select-text">
            <h3>Представник</h3>
          </div>
        </label>
      </div>
      <p class="smaller-text">Увага! <br>
      Після підтвердження вибору зміни профіля буде неможлива.</p>
      <a class="btn btn-modal" (click)="completeRegister()">Підтвердити</a>
    </div>
  </div>
</kendo-dialog>
