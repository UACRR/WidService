<div class="profile-wrap">
  <div class="header-line-wrap">
    <h3>Профіль</h3>
    <div class="header-line"></div>
  </div>
  <div class="inputs-wrap">
    <div class="row-flex">
      <input type="text" placeholder="Ім'я">
      <input type="email" placeholder="ivmich@gmail.com">
    </div>
    <div class="row-flex">
      <input type="text" placeholder="Прізвище">
      <input type="phone" placeholder="+380 (хх) ххх хх хх">
    </div>
    <div class="row-flex">
      <input type="text" placeholder="По-батькові">
      <div class="profile-type">
        <p>Тип профілю: <span>Споживач</span></p>
      </div>
    </div>
    <div class="row-flex">
      <h4 class="change-pas">Змінити пароль</h4>
      <div class="btns-wrap">
        <div class="btn btn-blue">Змінити</div>
        <div class="btn btn-blue">Зберегти</div>
      </div>
    </div>
  </div>
</div>
<!-- <div class="modal-bg"></div> -->
<div class="modal-wrap">
  <div class="modal">
    <div class="close-btn"></div>
    <h1>Зміна паролю</h1>
    <div class="red-line"></div>
    <input type="password" placeholder="Новий пароль">
    <input type="password" placeholder="Підтвердження пароля">
    <div class="row-flex">
      <div class="btn">Зберегти зміни</div>
      <div class="btn">Відмінити</div>
    </div>
  </div>
</div>
